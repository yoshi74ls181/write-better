<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feedback</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- KaTeX typesets the math. Offline, formulas stay as their TeX source. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f6f3; --paper: #fff; --ink: #1f2328; --muted: #6b7280; --line: #e3e1dc;
    --line-strong: #cfccc5; --line-hover: #c9c6bf; --line-faint: #f0eee9; --sunken: #f3f2ef;
    --raised: #faf9f7; --quote-ink: #444; --select: #cfe0ff; --shadow: rgba(0,0,0,.16);
    --overlay: rgba(247,246,243,.92); --spin-track: #d6d3cc; --dot-off: #9ca3af;
    --dot-on: #16a34a; --dot-warn: #f59e0b;
    --accent: #2f6fde; --accent-ink: #fff; --accent-soft: #e8f0fd; --mark: #fff1a8; --mark-saved: #ffe08a;
    --mark-active: #ffc94d; --mark-edge: #e0a800; --danger: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --paper: #222326; --ink: #e6e6e3; --muted: #9a9ea6; --line: #3a3b3f;
      --line-strong: #4a4b50; --line-hover: #5a5c62; --line-faint: #2d2e32; --sunken: #1b1c1f;
      --raised: #2a2b2f; --quote-ink: #b8b8b4; --select: #2f4a7a; --shadow: rgba(0,0,0,.5);
      --overlay: rgba(23,24,26,.92); --spin-track: #4a4b50; --dot-off: #6b7280;
      --dot-on: #22c55e; --dot-warn: #fbbf24;
      --accent: #5b8ff0; --accent-ink: #fff; --accent-soft: #263552; --mark: #5a4a12; --mark-saved: #6e5714;
      --mark-active: #8a6a10; --mark-edge: #c9a227; --danger: #f97316;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
           padding: 8px 12px; background: var(--paper); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; }
  header .hint { color: var(--muted); font-size: 13px; min-width: 0; white-space: nowrap; overflow: hidden;
                 text-overflow: ellipsis; }
  header button { font-size: 13px; padding: 4px 10px; white-space: nowrap; }
  header .spacer { flex: 1; }
  #agent { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #agent .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot-off); }
  #agent.on .dot { background: var(--dot-on); }
  #agent.warn .dot { background: var(--dot-warn); }
  button { font: inherit; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
           border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--line-hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.link { border: none; background: none; padding: 0 4px; color: var(--muted); font-size: 12px; }
  button.link:hover { color: var(--danger); }
  /* The sidebar narrows with the window and only drops below the document on very narrow screens. */
  main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(240px, 28vw, 340px); gap: 10px;
         max-width: 1240px; margin: 0 auto; padding: 8px 10px; }
  #doc { background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
            padding: 24px 24px 24px 34px; font: 15px/1.6 Georgia, "Iowan Old Style", "Times New Roman", serif; }
  #doc h1, #doc h2, #doc h3, #doc h4 { font-family: system-ui, "Segoe UI", sans-serif; line-height: 1.25; }
  #doc h1 { font-size: 24px; margin-top: 0; }
  #doc pre { background: var(--sunken); padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
  #doc code { font-family: ui-monospace, Consolas, monospace; font-size: .88em; }
  #doc table { border-collapse: collapse; margin: 1em 0; font-size: 14px; }
  #doc th, #doc td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
  #doc blockquote { margin: 1em 0; padding-left: 14px; border-left: 3px solid var(--line); color: var(--quote-ink); }
  #doc li.sub { margin-left: 1.6em; }
  #doc ::selection { background: var(--select); }
  #doc .math:not(.typeset) { font-family: ui-monospace, Consolas, monospace; font-size: .88em; white-space: pre-wrap; }
  #doc .math.display { display: block; margin: .8em 0; overflow-x: auto; text-align: center; }
  #doc .math.display:not(.typeset) { text-align: left; }
  #doc .math .katex-display { margin: 0; }
  /* Comments on a whole paragraph or section: a bar in the left margin, and a tint while open. */
  #doc [data-block] { position: relative; }
  #doc .c-scoped::before { content: ""; position: absolute; left: -8px; top: 3px; bottom: 3px; width: 3px;
                           border-radius: 2px; background: var(--mark-saved); }
  #doc .c-scoped.c-saved::before { background: var(--mark-edge); }
  #doc .c-active { background: var(--accent-soft); box-shadow: 0 0 0 6px var(--accent-soft); border-radius: 2px; }
  #scope-btn { position: absolute; z-index: 4; display: none; padding: 0 6px; font-size: 13px; line-height: 22px;
               color: var(--muted); }
  #scope-btn.show { display: block; }
  #scope-btn:hover { color: var(--accent); border-color: var(--accent); }
  mark.hl { background: var(--mark); color: inherit; border-radius: 2px; cursor: pointer; }
  mark.hl:has(> .math.display) { display: block; }
  mark.hl.saved { background: var(--mark-saved); border-bottom: 2px solid var(--mark-edge); }
  mark.hl.active { background: var(--mark-active); }
  aside { position: sticky; top: 52px; align-self: start; max-height: calc(100vh - 60px);
          display: flex; flex-direction: column; gap: 10px; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; }
  /* Natural height, but when the sidebar is full the list shrinks (and scrolls) long before the panel does,
     down to about one card. */
  #list { flex: 0 1000 auto; min-height: min(120px, 20vh); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
  .item { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
  .item:hover { border-color: var(--line-hover); }
  .item .quote { font-size: 13px; color: var(--muted); border-left: 3px solid var(--mark-saved);
                 padding-left: 8px; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2;
                 -webkit-box-orient: vertical; overflow: hidden; }
  .item .text { font-size: 14px; white-space: pre-wrap; }
  .item.draft .text { color: var(--muted); font-style: italic; }
  .item .row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .item .tag { font-size: 11px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 2px; }

  /* Comment panel at the top of the sidebar, so it never covers the document:
     a dropdown whose options are editable. */
  #pop { flex: 0 1 auto; min-height: 0; flex-direction: column; background: var(--paper); border: 1px solid var(--accent); border-radius: 10px;
         box-shadow: 0 4px 14px var(--shadow); display: none; }
  #pop.open { display: flex; }  /* fits the sidebar; the guess list scrolls inside it */
  #pop .q { padding: 8px 10px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line);
            max-height: 72px; overflow: hidden; }
  #pop .q b { color: var(--ink); font-weight: 500; }
  .combo { display: flex; flex-direction: column; min-height: 0; margin: 8px 8px 0; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
  .combo-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer;
                background: var(--raised); font-size: 14px; user-select: none; }
  .combo-head .val { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box;
                    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #pop .q, #pop .foot, .combo-head { flex: none; }
  .combo-head .val.placeholder { color: var(--muted); }
  .combo-head .caret { color: var(--muted); transition: transform .15s; }
  .combo.closed .caret { transform: rotate(-90deg); }
  .combo.closed .opts { display: none; }
  .opts { border-top: 1px solid var(--line); min-height: 60px; overflow-y: auto; }
  .opt { display: flex; gap: 8px; align-items: flex-start; padding: 6px 10px; border-bottom: 1px solid var(--line-faint); }
  .opt:last-child { border-bottom: none; }
  .opt.sel { background: var(--accent-soft); }
  .opt .pick { flex: none; margin: 9px 0 0; accent-color: var(--accent); cursor: pointer; }
  .opt .num { font-size: 11px; color: var(--muted); width: 14px; padding-top: 7px; text-align: right; flex: none; }
  .opt textarea { flex: 1; border: 1px solid transparent; border-radius: 5px; background: transparent;
                  font: 14px/1.4 system-ui, "Segoe UI", sans-serif; color: var(--ink); resize: none;
                  padding: 5px 7px; min-height: 30px; overflow: hidden; }
  .opt textarea:hover { border-color: var(--line); background: var(--paper); }
  .opt textarea:focus { outline: none; border-color: var(--accent); background: var(--paper); }
  .opt.own textarea::placeholder { color: var(--muted); font-style: italic; }
  .opt.loading { color: var(--muted); font-size: 13px; padding: 10px 12px; align-items: center; }
  .spin { width: 14px; height: 14px; border: 2px solid var(--spin-track); border-top-color: var(--accent);
          border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #pop .foot { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
  #pop .foot .keys { flex: 1; font-size: 12px; color: var(--muted); }
  #overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 50; display: none;
             align-items: center; justify-content: center; text-align: center; }
  #overlay.open { display: flex; }
  #overlay div { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 28px 36px; }
  @media (max-width: 600px) {
    main { grid-template-columns: 1fr; } aside { position: static; max-height: none; }
    header { flex-wrap: wrap; row-gap: 6px; } header .hint { display: none; }
    /* The sidebar is below the document here, so the panel sits at the bottom of the screen. */
    #pop { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 20; max-height: 70vh; overflow-y: auto; }
    .opts { max-height: 35vh; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Feedback</h1>
  <span class="hint" title="Select words or sentences to comment on them, or use ¶ and § in the margin for a whole paragraph or section.">Select words or sentences to comment on them, or use ¶ and § in the margin for a whole paragraph or section.</span>
  <span class="spacer"></span>
  <span id="agent"><span class="dot"></span><span id="agent-text">connecting…</span></span>
  <button id="doc-comment">Comment on the whole document</button>
  <button class="primary" id="finish">Finish &amp; send</button>
</header>
<main>
  <article id="doc">Loading…</article>
  <aside>
    <h2>Comments <span id="count"></span></h2>
    <div id="pop" role="dialog" aria-label="Comment">
      <div class="q"><span id="pop-on">On:</span> <b id="pop-quote"></b></div>
      <div class="combo" id="combo">
        <div class="combo-head" id="combo-head">
          <span class="val placeholder" id="combo-val">Choose or write a comment</span>
          <span class="caret">▾</span>
        </div>
        <div class="opts" id="opts"></div>
      </div>
      <div class="foot">
        <span class="keys">Ctrl+Enter to save · Esc to close</span>
        <button id="pop-cancel">Cancel</button>
        <button class="primary" id="pop-save" disabled>Save</button>
      </div>
    </div>
    <div id="list"></div>
  </aside>
</main>

<button id="scope-btn"></button>

<div id="overlay"><div>
  <h2 style="margin-top:0">Feedback sent</h2>
  <p>The agent will now digest your comments. You can close this tab.</p>
</div></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const docEl = $("doc"), pop = $("pop"), opts = $("opts");

// id -> {id, scope, text, paragraph, section, block, start, guesses, rows, own, sels, parts, comment, source, status}
// sels holds the ticked rows by key: "g0", "g1", … for guesses and "own" for the user's own row,
// so a tick stays on its row when guesses arrive. parts is what was saved, one entry per ticked row.
// scope is "selection" (a highlighted passage) or "paragraph", "section", or "document" (the whole thing).
const H = new Map();
let current = null;       // id of the highlight open in the comment panel
let finished = false;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}
const newId = () => "h" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ---------- text helpers ----------
// A block's text is its text nodes in order, except that each formula (.math)
// counts as one unit whose text is its TeX source. Highlight offsets, quotes, and
// paragraphs all use this text, so they don't depend on how KaTeX lays out math.
function segments(root) {
  const out = [];
  (function walk(el) {
    for (const c of el.childNodes) {
      if (c.nodeType === 3) out.push({ node: c, len: c.data.length });
      else if (c.nodeType === 1 && c.classList.contains("math")) out.push({ node: c, math: true, len: c.dataset.src.length });
      else if (c.nodeType === 1) walk(c);
    }
  })(root);
  return out;
}
function textOf(el) {
  const math = el.closest(".math");
  if (math) return math.dataset.src;
  return segments(el).map((s) => s.math ? s.node.dataset.src : s.node.data).join("");
}
function blockOf(node) {
  const el = node.nodeType === 1 ? node : node.parentElement;
  return el && el.closest("[data-block]");
}
function contextOf(node) {
  const el = node.nodeType === 1 ? node : node.parentElement;
  return el.closest("li, td, th, p, blockquote, pre, h1, h2, h3, h4, h5, h6, [data-block]");
}
function sectionOf(block) {
  for (let el = block; el; el = el.previousElementSibling)
    if (/^H[1-6]$/.test(el.tagName) && el !== block) return textOf(el).trim();
  return /^H[1-6]$/.test(block.tagName) ? textOf(block).trim() : "";
}
// Character offset in textOf(block) of the boundary point (node, offset). A point
// inside a formula snaps to the formula's start, or to its end when `isEnd`.
function offsetIn(block, node, offset, isEnd) {
  const point = document.createRange(); point.setStart(node, offset);
  let pos = 0;
  for (const s of segments(block)) {
    if (s.math ? s.node.contains(node) : s.node === node)
      return s.math ? pos + (isEnd ? s.len : 0) : pos + offset;
    const segEnd = s.math ? s.node.childNodes.length : s.len;
    if (point.comparePoint(s.node, segEnd) > 0) return pos;  // segment ends after the point
    pos += s.len;
  }
  return pos;
}
// Wrap [start, end) character range of `block` in <mark> elements. A formula the
// range touches is wrapped whole.
function wrapRange(block, start, end, id) {
  let pos = 0; const marks = [];
  for (const seg of segments(block)) {
    const len = seg.len, a = Math.max(start, pos), b = Math.min(end, pos + len);
    if (a < b && seg.math) {
      const m = document.createElement("mark");
      m.className = "hl"; m.dataset.id = id;
      seg.node.parentNode.insertBefore(m, seg.node); m.appendChild(seg.node); marks.push(m);
    } else if (a < b) {
      let node = seg.node;
      if (a > pos) node = node.splitText(a - pos);
      if (b < pos + len) node.splitText(b - a);
      const m = document.createElement("mark");
      m.className = "hl"; m.dataset.id = id;
      node.parentNode.insertBefore(m, node); m.appendChild(node); marks.push(m);
    }
    pos += len;
  }
  return marks;
}
function unwrap(id) {
  document.querySelectorAll(`mark.hl[data-id="${id}"]`).forEach((m) => {
    const p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); p.normalize();
  });
}
function marksOf(id) { return [...document.querySelectorAll(`mark.hl[data-id="${id}"]`)]; }
const blockEl = (n) => docEl.querySelector(`[data-block="${n}"]`);
const isHeading = (el) => /^H[1-6]$/.test(el.tagName);
// A section is its heading plus every block up to the next heading of the same or a higher level.
function sectionEls(heading) {
  const out = [heading], level = +heading.tagName[1];
  for (let el = heading.nextElementSibling; el && !(isHeading(el) && +el.tagName[1] <= level); el = el.nextElementSibling)
    out.push(el);
  return out;
}
// The elements a comment is about, and the one the sidebar scrolls to.
function targetEls(h) {
  if (h.scope === "document") return [];
  if (h.scope === "selection") return marksOf(h.id);
  const b = blockEl(h.block); if (!b) return [];
  return h.scope === "section" ? sectionEls(b) : [b];
}
function anchorOf(h) {
  if (h.scope === "document") return $("doc-comment");
  const els = targetEls(h);
  return h.scope === "selection" ? els[els.length - 1] : els[0];
}
function paintMarks() {
  docEl.querySelectorAll(".c-scoped, .c-active").forEach((el) => el.classList.remove("c-scoped", "c-saved", "c-active"));
  for (const h of H.values()) {
    if (h.scope === "selection") {
      marksOf(h.id).forEach((m) => {
        m.classList.toggle("saved", h.status === "saved");
        m.classList.toggle("active", h.id === current);
      });
    } else if (h.scope !== "document") {
      const els = targetEls(h); if (!els.length) continue;
      els[0].classList.add("c-scoped");
      if (h.status === "saved") els[0].classList.add("c-saved");
      if (h.id === current) els.forEach((el) => el.classList.add("c-active"));
    }
  }
}

// ---------- making a highlight ----------
docEl.addEventListener("mouseup", (e) => {
  if (finished || pop.contains(e.target)) return;
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  if (!docEl.contains(range.commonAncestorContainer)) return;
  const text = sel.toString().trim();
  if (!text) return;
  const startBlock = blockOf(range.startContainer), endBlock = blockOf(range.endContainer);
  if (!startBlock) return;
  // Highlights that span blocks are clipped to the first block.
  const blockText = textOf(startBlock);
  const start = offsetIn(startBlock, range.startContainer, range.startOffset, false);
  const end = startBlock === endBlock ? offsetIn(startBlock, range.endContainer, range.endOffset, true)
                                      : blockText.length;
  const raw = blockText.slice(start, end);
  const lead = raw.length - raw.trimStart().length, trail = raw.length - raw.trimEnd().length;
  const s = start + lead, t = end - trail;
  if (t <= s) return;
  sel.removeAllRanges();
  const id = newId();
  const h = {
    id, scope: "selection", text: blockText.slice(s, t),
    paragraph: textOf(contextOf(range.startContainer)).trim(),
    section: sectionOf(startBlock), block: +startBlock.dataset.block, start: s,
    guesses: null, rows: [], own: "", sels: new Set(), status: "draft",
  };
  H.set(id, h);
  wrapRange(startBlock, s, t, id);
  api("/highlight", { id, scope: "selection", text: h.text, paragraph: h.paragraph, section: h.section });
  pollGuesses(id);
  openPop(id);
  renderList();
});

// ---------- comments on a whole paragraph, section, or document ----------
// Each one has a single comment; asking again reopens it.
function commentOnWhole(scope, block) {
  if (finished) return;
  const n = block ? +block.dataset.block : -1;
  const old = [...H.values()].find((h) => h.scope === scope && h.block === n);
  if (old) return openPop(old.id);
  const id = newId();
  const text = scope === "document" ? $("title").textContent : textOf(block).trim();
  const h = {
    id, scope, text, paragraph: scope === "paragraph" ? text : "",
    section: scope === "document" ? "" : scope === "section" ? text : sectionOf(block), block: n, start: -1,
    guesses: null, rows: [], own: "", sels: new Set(), status: "draft",
  };
  H.set(id, h);
  api("/highlight", { id, scope, text: h.text, paragraph: h.paragraph, section: h.section });
  pollGuesses(id);
  openPop(id);
  renderList();
}
$("doc-comment").addEventListener("click", () => commentOnWhole("document", null));

// Hovering a block shows ¶ (this paragraph) or, on a heading, § (this section) in the left margin.
const scopeBtn = $("scope-btn");
let hoverBlock = null;
docEl.addEventListener("mousemove", (e) => {
  const b = e.target.closest && e.target.closest("[data-block]");
  if (finished || !b || !docEl.contains(b) || b === hoverBlock) return;
  hoverBlock = b;
  const sec = isHeading(b);
  scopeBtn.textContent = sec ? "§" : "¶";
  scopeBtn.title = sec ? "Comment on this whole section" : "Comment on this whole paragraph";
  const d = docEl.getBoundingClientRect(), r = b.getBoundingClientRect();
  scopeBtn.style.left = (d.left + window.scrollX + 4) + "px";
  scopeBtn.style.top = (r.top + window.scrollY) + "px";
  scopeBtn.classList.add("show");
});
docEl.addEventListener("mouseleave", (e) => {
  if (e.relatedTarget === scopeBtn) return;
  scopeBtn.classList.remove("show"); hoverBlock = null;
});
scopeBtn.addEventListener("mouseleave", (e) => {
  if (docEl.contains(e.relatedTarget)) return;
  scopeBtn.classList.remove("show"); hoverBlock = null;
});
scopeBtn.addEventListener("click", () => {
  if (hoverBlock) commentOnWhole(isHeading(hoverBlock) ? "section" : "paragraph", hoverBlock);
});

docEl.addEventListener("click", (e) => {
  const m = e.target.closest("mark.hl");
  if (m && window.getSelection().isCollapsed) openPop(m.dataset.id);
});

async function pollGuesses(id) {
  while (H.has(id) && !finished) {
    const h = H.get(id);
    if (h.guesses) return;
    try {
      const r = await fetch("/guesses/" + id).then((x) => x.json());
      if (r.ready) {
        h.guesses = r.guesses;
        h.rows = r.guesses.slice();
        if (h.status === "saved")
          for (const part of h.parts) if (part.guess_index >= 0 && part.guess_index < h.rows.length) h.rows[part.guess_index] = part.text;
        if (current === id) renderOpts(true);
        renderList();
        return;
      }
      h.ahead = r.ahead;
      if (current === id) updateLoading();
    } catch (_) {}
    await new Promise((res) => setTimeout(res, 800));
  }
}

// ---------- comment panel / editable dropdown ----------
function openPop(id) {
  const h = H.get(id); if (!h) return;
  if (current && current !== id) closePop(false);
  current = id;
  $("pop-on").textContent = { selection: "On:", paragraph: "On this whole paragraph:",
                              section: "On this whole section:", document: "On the whole document:" }[h.scope];
  $("pop-quote").textContent = h.text.length > 220 ? h.text.slice(0, 220) + "…" : h.text;
  $("combo").classList.remove("closed");
  renderOpts(false);
  pop.classList.add("open");
  growAll(); keepVisible();
  paintMarks(); renderList();
  const own = opts.querySelector(".own textarea");
  if (h.status === "saved" && h.sels.size) focusRow([...h.sels][0]); else if (!h.guesses && own) own.focus({ preventScroll: true });
}
function renderOpts(keepFocus) {
  const h = H.get(current); if (!h) return;
  const active = document.activeElement, activeKey = active && active.dataset ? active.dataset.key : null;
  opts.innerHTML = "";
  if (!h.guesses) {
    const d = document.createElement("div");
    d.className = "opt loading"; d.id = "loading";
    d.innerHTML = '<span class="spin"></span><span id="loading-text"></span>';
    opts.appendChild(d); updateLoading();
  }
  h.rows.forEach((txt, i) => opts.appendChild(makeRow(h, i, txt, false)));
  opts.appendChild(makeRow(h, -1, h.own, true));  // the "write my own" row comes last
  if (keepFocus && activeKey) {
    const ta = opts.querySelector(`textarea[data-key="${activeKey}"]`);
    if (ta) { ta.focus({ preventScroll: true }); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
  growAll();
  syncHead();
  keepVisible();
}
// On a narrow screen the panel covers the bottom of the window. Pad the page by
// its height and scroll so the text being commented on stays above it.
function keepVisible() {
  const h = H.get(current);
  if (!h || getComputedStyle(pop).position !== "fixed") { document.body.style.paddingBottom = ""; return; }
  document.body.style.paddingBottom = (pop.offsetHeight + 16) + "px";
  const a = h.scope === "document" ? null : anchorOf(h); if (!a) return;
  const bottom = a.getBoundingClientRect().bottom, limit = pop.getBoundingClientRect().top - 12;
  if (bottom > limit) window.scrollBy({ top: bottom - limit, behavior: "smooth" });
}
function updateLoading() {
  const h = H.get(current), el = $("loading-text"); if (!h || !el) return;
  el.textContent = h.ahead > 0 ? `Guessing your comment… (${h.ahead} ahead in queue)` : "Guessing your comment…";
}
// Each row has a checkbox, and any number of rows can be ticked. Clicking the row
// or its checkbox toggles it; clicking into the text or typing in it ticks it.
function makeRow(h, i, txt, isOwn) {
  const key = isOwn ? "own" : "g" + i;
  const row = document.createElement("div");
  row.className = "opt" + (isOwn ? " own" : "") + (h.sels.has(key) ? " sel" : "");
  const box = document.createElement("input");
  box.type = "checkbox"; box.className = "pick"; box.tabIndex = -1; box.checked = h.sels.has(key);
  box.title = isOwn ? "Include my own comment" : "Include this guess";
  const num = document.createElement("span"); num.className = "num"; num.textContent = isOwn ? "✎" : i + 1;
  const ta = document.createElement("textarea");
  ta.rows = 1; ta.value = txt; ta.dataset.key = key;
  ta.placeholder = isOwn ? "Write my own comment…" : "";
  ta.addEventListener("mousedown", () => pick(key, true));
  ta.addEventListener("input", () => {
    if (isOwn) h.own = ta.value; else h.rows[i] = ta.value;
    pick(key, true);
    grow(ta);
  });
  box.addEventListener("click", () => pick(key, box.checked));
  row.addEventListener("mousedown", (e) => {
    if (e.target === ta || e.target === box) return;
    e.preventDefault(); pick(key, !h.sels.has(key));
  });
  row.append(box, num, ta);
  return row;
}
// Fit a textarea to its text. It must be visible to measure, so growAll() runs
// again whenever the panel or the dropdown opens. The border is added back
// because scrollHeight leaves it out.
function grow(ta) {
  if (!ta.offsetParent) return;
  ta.style.height = "auto";
  ta.style.height = (ta.scrollHeight + ta.offsetHeight - ta.clientHeight) + "px";
}
function growAll() { opts.querySelectorAll("textarea").forEach(grow); }
function pick(key, on) {
  const h = H.get(current); if (!h) return;
  if (on) h.sels.add(key); else h.sels.delete(key);
  opts.querySelectorAll(".opt").forEach((r) => {
    const ta = r.querySelector("textarea"); if (!ta) return;
    const sel = h.sels.has(ta.dataset.key);
    r.classList.toggle("sel", sel); r.querySelector(".pick").checked = sel;
  });
  syncHead();
}
function focusRow(key) { const ta = opts.querySelector(`textarea[data-key="${key}"]`); if (ta) ta.focus({ preventScroll: true }); }
// The ticked rows, in list order, each with where it came from.
function chosenParts(h) {
  const parts = [];
  h.rows.forEach((txt, i) => {
    const t = txt.trim(); if (!h.sels.has("g" + i) || !t) return;
    const edited = t !== ((h.guesses && h.guesses[i]) || "").trim();
    parts.push({ text: t, source: edited ? "edited-guess" : "guess", guess_index: i });
  });
  if (h.sels.has("own") && h.own.trim()) parts.push({ text: h.own.trim(), source: "own", guess_index: -1 });
  return parts;
}
const joinParts = (parts) => parts.map((p) => p.text).join("\n");
function syncHead() {
  const h = H.get(current); if (!h) return;
  const t = joinParts(chosenParts(h)), v = $("combo-val");
  v.textContent = t || "Tick one or more, or write your own"; v.classList.toggle("placeholder", !t);
  $("pop-save").disabled = !t;
}
$("combo-head").addEventListener("click", () => { $("combo").classList.toggle("closed"); growAll(); });

function closePop(discardIfDraft) {
  const h = H.get(current);
  if (h && discardIfDraft && h.status === "draft") removeHighlight(h.id);
  current = null; pop.classList.remove("open"); document.body.style.paddingBottom = "";
  paintMarks(); renderList();
}
function removeHighlight(id) {
  unwrap(id); H.delete(id);
  api("/cancel", { id });
}
$("pop-cancel").addEventListener("click", () => closePop(true));

async function save() {
  const h = H.get(current); if (!h) return;
  const parts = chosenParts(h); if (!parts.length) return;
  const kinds = new Set(parts.map((p) => p.source));
  h.parts = parts; h.comment = joinParts(parts); h.status = "saved";
  h.source = kinds.size === 1 ? parts[0].source : "mixed";
  await api("/comment", {
    id: h.id, scope: h.scope, text: h.text, paragraph: h.paragraph, section: h.section, block: h.block, start: h.start,
    comment: h.comment, source: h.source, parts, guesses: h.guesses || [],
  });
  if (current === h.id) closePop(false);  // the user may have opened another comment meanwhile
}
$("pop-save").addEventListener("click", save);

document.addEventListener("keydown", (e) => {
  if (!pop.classList.contains("open")) return;
  if (e.key === "Escape") { e.preventDefault(); closePop(false); }
  else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); }
});
document.addEventListener("mousedown", (e) => {
  if (pop.classList.contains("open") && !pop.contains(e.target) && !e.target.closest("mark.hl, .item, #scope-btn, #doc-comment"))
    closePop(false);  // keep drafts; they stay in the sidebar
});
window.addEventListener("resize", () => { if (current) { growAll(); keepVisible(); } });

// ---------- sidebar ----------
function sourceLabel(parts) {
  const n = (src) => parts.filter((p) => p.source === src).length;
  const bits = [];
  if (n("guess")) bits.push(n("guess") > 1 ? `picked ${n("guess")} guesses` : "picked a guess");
  if (n("edited-guess")) bits.push(n("edited-guess") > 1 ? `edited ${n("edited-guess")} guesses` : "edited a guess");
  if (n("own")) bits.push("own words");
  return bits.join(" + ");
}
function renderList() {
  const list = $("list"); list.innerHTML = "";
  const items = [...H.values()].sort((a, b) => a.block - b.block || a.start - b.start);
  $("count").textContent = items.length ? `(${items.filter((h) => h.status === "saved").length})` : "";
  if (!items.length) { list.innerHTML = '<div class="empty">No comments yet. Select text in the document to add one.</div>'; return; }
  for (const h of items) {
    if (h.id === current) continue;  // it is shown in the comment panel above the list
    const d = document.createElement("div");
    d.className = "item" + (h.status === "draft" ? " draft" : "");
    const q = document.createElement("div"); q.className = "quote";
    q.textContent = { selection: "", paragraph: "¶ ", section: "§ ", document: "Whole document: " }[h.scope] + h.text;
    const t = document.createElement("div"); t.className = "text";
    t.textContent = h.status === "saved" ? h.comment : h.guesses ? "Guesses ready — click to choose" : "Awaiting comment…";
    const row = document.createElement("div"); row.className = "row";
    const tag = document.createElement("span"); tag.className = "tag";
    tag.textContent = h.status === "saved" ? sourceLabel(h.parts) : "draft";
    const del = document.createElement("button"); del.className = "link"; del.textContent = "Delete";
    del.addEventListener("click", (e) => {
      e.stopPropagation();
      if (current === h.id) closePop(false);
      if (h.status === "saved") api("/comment/delete", { id: h.id });
      removeHighlight(h.id); renderList();
    });
    row.append(tag, del); d.append(q, t, row);
    d.addEventListener("click", () => {
      const m = h.scope === "document" ? null : anchorOf(h);
      if (m) m.scrollIntoView({ block: "center", behavior: "smooth" });
      setTimeout(() => openPop(h.id), m ? 250 : 0);
    });
    list.appendChild(d);
  }
}

// ---------- agent status / finish ----------
async function heartbeat() {
  try {
    const s = await fetch("/state").then((r) => r.json());
    const el = $("agent"), txt = $("agent-text"), ago = s.agent_seconds_ago;
    el.className = ago !== null && ago < 120 ? "on" : "warn";
    txt.textContent = ago === null ? "agent not connected yet" : ago < 15 ? "agent listening" :
      ago < 120 ? "agent writing guesses" : "agent idle — you can still write your own";
  } catch (_) { $("agent").className = "warn"; $("agent-text").textContent = "server unreachable"; }
}
$("finish").addEventListener("click", async () => {
  const drafts = [...H.values()].filter((h) => h.status === "draft").length;
  if (drafts && !confirm(`${drafts} highlight(s) have no comment yet and will be dropped. Finish anyway?`)) return;
  finished = true;
  for (const h of [...H.values()]) if (h.status === "draft") removeHighlight(h.id);
  await api("/done", {});
  closePop(false); $("overlay").classList.add("open");
});

// ---------- math ----------
// Typeset each formula in place. Marks wrap the .math element from outside, so
// highlights survive typesetting whether it happens before or after they are made.
function loadKatex() {
  if (!docEl.querySelector(".math")) return;
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js";
  s.onload = () => docEl.querySelectorAll(".math").forEach((el) => {
    try {
      katex.render(el.dataset.tex, el, { displayMode: el.classList.contains("display"), throwOnError: false });
      el.classList.add("typeset");
    } catch (_) {}  // leave the TeX source showing
  });
  document.head.appendChild(s);
}

// A paragraph or section comment keeps its block if the text there still matches,
// or else moves to the block (a heading, for a section) whose text does.
function reanchorWhole(h) {
  const fits = (b) => b && textOf(b).trim() === h.text && (h.scope === "section") === isHeading(b);
  if (fits(blockEl(h.block))) return;
  const b = [...docEl.querySelectorAll("[data-block]")].find(fits);
  if (b) h.block = +b.dataset.block;
}

// ---------- startup: render document, restore saved comments ----------
(async function init() {
  const doc = await fetch("/doc").then((r) => r.json());
  document.title = "Feedback · " + doc.name; $("title").textContent = doc.name;
  docEl.innerHTML = doc.html;
  loadKatex();
  const st = await fetch("/state").then((r) => r.json());
  for (const c of st.comments || []) {
    const h = { id: c.id, scope: c.scope || "selection", text: c.text, paragraph: c.paragraph, section: c.section, block: c.block ?? 1e9,
                start: c.start ?? 0, guesses: c.guesses || [], rows: (c.guesses || []).slice(), own: "",
                comment: c.comment, source: c.source, sels: new Set(), status: "saved",
                parts: c.parts || [{ text: c.comment, source: c.source, guess_index: c.guess_index ?? -1 }] };
    for (const part of h.parts) {
      if (part.guess_index >= 0 && part.guess_index < h.rows.length) { h.rows[part.guess_index] = part.text; h.sels.add("g" + part.guess_index); }
      else { h.own = h.own ? h.own + "\n" + part.text : part.text; h.sels.add("own"); }
    }
    H.set(h.id, h);
    if (h.scope !== "selection") { if (h.scope !== "document") reanchorWhole(h); continue; }
    // Re-anchor: try the stored offset, then search the block, then the whole document.
    let block = docEl.querySelector(`[data-block="${h.block}"]`), s = h.start;
    if (!block || textOf(block).slice(s, s + h.text.length) !== h.text) {
      s = block ? textOf(block).indexOf(h.text) : -1;
      if (s < 0) {
        block = [...docEl.querySelectorAll("[data-block]")].find((b) => textOf(b).includes(h.text));
        s = block ? textOf(block).indexOf(h.text) : -1;
      }
    }
    if (block && s >= 0) wrapRange(block, s, s + h.text.length, h.id);
  }
  if (st.done) { finished = true; $("overlay").classList.add("open"); }
  paintMarks(); renderList(); heartbeat(); setInterval(heartbeat, 5000);
})();
</script>
</body>
</html>
