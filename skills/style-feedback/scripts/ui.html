<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Writing feedback</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f7f6f3; --paper: #fff; --ink: #1f2328; --muted: #6b7280; --line: #e3e1dc;
    --accent: #2f6fde; --accent-soft: #e8f0fd; --mark: #fff1a8; --mark-saved: #ffe08a;
    --mark-active: #ffc94d; --danger: #c2410c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
           padding: 10px 20px; background: var(--paper); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .hint { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  #agent { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #agent .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
  #agent.on .dot { background: #16a34a; }
  #agent.warn .dot { background: #f59e0b; }
  button { font: inherit; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
           border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: #c9c6bf; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.link { border: none; background: none; padding: 0 4px; color: var(--muted); font-size: 12px; }
  button.link:hover { color: var(--danger); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px;
         max-width: 1240px; margin: 0 auto; padding: 20px; }
  #doc { background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
            padding: 36px 48px; font: 17px/1.65 Georgia, "Iowan Old Style", "Times New Roman", serif; }
  #doc h1, #doc h2, #doc h3, #doc h4 { font-family: system-ui, "Segoe UI", sans-serif; line-height: 1.25; }
  #doc h1 { font-size: 28px; margin-top: 0; }
  #doc pre { background: #f3f2ef; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
  #doc code { font-family: ui-monospace, Consolas, monospace; font-size: .88em; }
  #doc table { border-collapse: collapse; margin: 1em 0; font-size: 15px; }
  #doc th, #doc td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
  #doc blockquote { margin: 1em 0; padding-left: 14px; border-left: 3px solid var(--line); color: #444; }
  #doc li.sub { margin-left: 1.6em; }
  #doc ::selection { background: #cfe0ff; }
  mark.hl { background: var(--mark); color: inherit; border-radius: 2px; cursor: pointer; }
  mark.hl.saved { background: var(--mark-saved); border-bottom: 2px solid #e0a800; }
  mark.hl.active { background: var(--mark-active); }
  aside { position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 84px);
          display: flex; flex-direction: column; gap: 10px; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; }
  #list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
  .item { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
  .item:hover { border-color: #c9c6bf; }
  .item.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .item .quote { font-size: 13px; color: var(--muted); border-left: 3px solid var(--mark-saved);
                 padding-left: 8px; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2;
                 -webkit-box-orient: vertical; overflow: hidden; }
  .item .text { font-size: 14px; white-space: pre-wrap; }
  .item.draft .text { color: var(--muted); font-style: italic; }
  .item .row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .item .tag { font-size: 11px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 2px; }

  /* Comment popover: a dropdown whose options are editable. */
  #pop { position: absolute; z-index: 20; width: 440px; max-width: calc(100vw - 24px);
         background: var(--paper); border: 1px solid #cfccc5; border-radius: 10px;
         box-shadow: 0 12px 32px rgba(0,0,0,.16); display: none; }
  #pop.open { display: block; }
  #pop .q { padding: 10px 14px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line);
            max-height: 72px; overflow: hidden; }
  #pop .q b { color: var(--ink); font-weight: 500; }
  .combo { margin: 10px 14px 0; border: 1px solid #cfccc5; border-radius: 8px; overflow: hidden; }
  .combo-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer;
                background: #faf9f7; font-size: 14px; user-select: none; }
  .combo-head .val { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .combo-head .val.placeholder { color: var(--muted); }
  .combo-head .caret { color: var(--muted); transition: transform .15s; }
  .combo.closed .caret { transform: rotate(-90deg); }
  .combo.closed .opts { display: none; }
  .opts { border-top: 1px solid var(--line); max-height: 320px; overflow-y: auto; }
  .opt { display: flex; gap: 8px; align-items: flex-start; padding: 6px 10px; border-bottom: 1px solid #f0eee9; }
  .opt:last-child { border-bottom: none; }
  .opt.sel { background: var(--accent-soft); }
  .opt .num { font-size: 11px; color: var(--muted); width: 14px; padding-top: 7px; text-align: right; flex: none; }
  .opt textarea { flex: 1; border: 1px solid transparent; border-radius: 5px; background: transparent;
                  font: 14px/1.4 system-ui, "Segoe UI", sans-serif; color: var(--ink); resize: none;
                  padding: 5px 7px; min-height: 30px; overflow: hidden; }
  .opt textarea:hover { border-color: var(--line); background: #fff; }
  .opt textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
  .opt.own textarea::placeholder { color: var(--muted); font-style: italic; }
  .opt.loading { color: var(--muted); font-size: 13px; padding: 10px 12px; align-items: center; }
  .spin { width: 14px; height: 14px; border: 2px solid #d6d3cc; border-top-color: var(--accent);
          border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #pop .foot { display: flex; align-items: center; gap: 8px; padding: 10px 14px; }
  #pop .foot .keys { flex: 1; font-size: 12px; color: var(--muted); }
  #overlay { position: fixed; inset: 0; background: rgba(247,246,243,.92); z-index: 50; display: none;
             align-items: center; justify-content: center; text-align: center; }
  #overlay.open { display: flex; }
  #overlay div { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 28px 36px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { position: static; max-height: none; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Writing feedback</h1>
  <span class="hint">Select any words or sentences to comment on them.</span>
  <span class="spacer"></span>
  <span id="agent"><span class="dot"></span><span id="agent-text">connecting…</span></span>
  <button class="primary" id="finish">Finish &amp; send</button>
</header>
<main>
  <article id="doc">Loading…</article>
  <aside>
    <h2>Comments <span id="count"></span></h2>
    <div id="list"></div>
  </aside>
</main>

<div id="pop" role="dialog" aria-label="Comment">
  <div class="q">On: <b id="pop-quote"></b></div>
  <div class="combo" id="combo">
    <div class="combo-head" id="combo-head">
      <span class="val placeholder" id="combo-val">Choose or write a comment</span>
      <span class="caret">▾</span>
    </div>
    <div class="opts" id="opts"></div>
  </div>
  <div class="foot">
    <span class="keys">Ctrl+Enter to save · Esc to close</span>
    <button id="pop-cancel">Cancel</button>
    <button class="primary" id="pop-save" disabled>Save</button>
  </div>
</div>

<div id="overlay"><div>
  <h2 style="margin-top:0">Feedback sent</h2>
  <p>The agent will now digest your comments. You can close this tab.</p>
</div></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const docEl = $("doc"), pop = $("pop"), opts = $("opts");

// id -> {id, text, paragraph, section, block, start, guesses, rows, sel, comment, source, guessIndex, status}
const H = new Map();
let current = null;       // id of the highlight open in the popover
let finished = false;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}
const newId = () => "h" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ---------- text-node helpers ----------
function textNodes(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const out = []; let n; while ((n = w.nextNode())) out.push(n); return out;
}
function blockOf(node) {
  const el = node.nodeType === 1 ? node : node.parentElement;
  return el && el.closest("[data-block]");
}
function contextOf(node) {
  const el = node.nodeType === 1 ? node : node.parentElement;
  return el.closest("li, td, th, p, blockquote, pre, h1, h2, h3, h4, h5, h6, [data-block]");
}
function sectionOf(block) {
  for (let el = block; el; el = el.previousElementSibling)
    if (/^H[1-6]$/.test(el.tagName) && el !== block) return el.textContent.trim();
  return /^H[1-6]$/.test(block.tagName) ? block.textContent.trim() : "";
}
function offsetIn(block, node, offset) {
  const r = document.createRange(); r.setStart(block, 0); r.setEnd(node, offset);
  return r.toString().length;
}
// Wrap [start, end) character range of `block` in <mark> elements.
function wrapRange(block, start, end, id) {
  let pos = 0; const marks = [];
  for (const t of textNodes(block)) {
    const len = t.data.length, a = Math.max(start, pos), b = Math.min(end, pos + len);
    if (a < b) {
      let node = t;
      if (a > pos) node = node.splitText(a - pos);
      if (b < pos + len) node.splitText(b - a);
      const m = document.createElement("mark");
      m.className = "hl"; m.dataset.id = id;
      node.parentNode.insertBefore(m, node); m.appendChild(node); marks.push(m);
    }
    pos += len;
  }
  return marks;
}
function unwrap(id) {
  document.querySelectorAll(`mark.hl[data-id="${id}"]`).forEach((m) => {
    const p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); p.normalize();
  });
}
function marksOf(id) { return [...document.querySelectorAll(`mark.hl[data-id="${id}"]`)]; }
function paintMarks() {
  for (const h of H.values())
    marksOf(h.id).forEach((m) => {
      m.classList.toggle("saved", h.status === "saved");
      m.classList.toggle("active", h.id === current);
    });
}

// ---------- making a highlight ----------
docEl.addEventListener("mouseup", (e) => {
  if (finished || pop.contains(e.target)) return;
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  if (!docEl.contains(range.commonAncestorContainer)) return;
  const text = sel.toString().trim();
  if (!text) return;
  const startBlock = blockOf(range.startContainer), endBlock = blockOf(range.endContainer);
  if (!startBlock) return;
  // Highlights that span blocks are clipped to the first block.
  const start = offsetIn(startBlock, range.startContainer, range.startOffset);
  const end = startBlock === endBlock ? offsetIn(startBlock, range.endContainer, range.endOffset)
                                      : startBlock.textContent.length;
  const raw = startBlock.textContent.slice(start, end);
  const lead = raw.length - raw.trimStart().length, trail = raw.length - raw.trimEnd().length;
  const s = start + lead, t = end - trail;
  if (t <= s) return;
  sel.removeAllRanges();
  const id = newId();
  const h = {
    id, text: startBlock.textContent.slice(s, t),
    paragraph: contextOf(range.startContainer).textContent.trim(),
    section: sectionOf(startBlock), block: +startBlock.dataset.block, start: s,
    guesses: null, rows: [], own: "", sel: -1, status: "draft",
  };
  H.set(id, h);
  wrapRange(startBlock, s, t, id);
  api("/highlight", { id, text: h.text, paragraph: h.paragraph, section: h.section });
  pollGuesses(id);
  openPop(id);
  renderList();
});

docEl.addEventListener("click", (e) => {
  const m = e.target.closest("mark.hl");
  if (m && window.getSelection().isCollapsed) openPop(m.dataset.id);
});

async function pollGuesses(id) {
  while (H.has(id) && !finished) {
    const h = H.get(id);
    if (h.guesses) return;
    try {
      const r = await fetch("/guesses/" + id).then((x) => x.json());
      if (r.ready) {
        h.guesses = r.guesses;
        h.rows = r.guesses.slice();
        if (h.status === "saved" && h.guessIndex >= 0 && h.guessIndex < h.rows.length) h.rows[h.guessIndex] = h.comment;
        if (current === id) renderOpts(true);
        renderList();
        return;
      }
      h.ahead = r.ahead;
      if (current === id) updateLoading();
    } catch (_) {}
    await new Promise((res) => setTimeout(res, 800));
  }
}

// ---------- popover / editable dropdown ----------
function openPop(id) {
  const h = H.get(id); if (!h) return;
  if (current && current !== id) closePop(false);
  current = id;
  $("pop-quote").textContent = h.text.length > 220 ? h.text.slice(0, 220) + "…" : h.text;
  $("combo").classList.remove("closed");
  renderOpts(false);
  pop.classList.add("open");
  position(id);
  paintMarks(); renderList();
  const own = opts.querySelector(".own textarea");
  if (h.status === "saved" && h.sel >= 0) focusRow(h.sel); else if (!h.guesses && own) own.focus({ preventScroll: true });
}
function position(id) {
  const m = marksOf(id); if (!m.length) { pop.style.top = (window.scrollY + 90) + "px"; pop.style.left = "40px"; return; }
  const r = m[m.length - 1].getBoundingClientRect(), w = pop.offsetWidth;
  const left = Math.min(Math.max(8, r.left + window.scrollX - 20), window.scrollX + document.documentElement.clientWidth - w - 12);
  pop.style.left = left + "px"; pop.style.top = (r.bottom + window.scrollY + 8) + "px";
}
function rowIndexOwn(h) { return h.rows.length; }  // the "write my own" row comes last
function renderOpts(keepFocus) {
  const h = H.get(current); if (!h) return;
  const active = document.activeElement, activeIdx = active && active.dataset ? active.dataset.idx : null;
  opts.innerHTML = "";
  if (!h.guesses) {
    const d = document.createElement("div");
    d.className = "opt loading"; d.id = "loading";
    d.innerHTML = '<span class="spin"></span><span id="loading-text"></span>';
    opts.appendChild(d); updateLoading();
  }
  h.rows.forEach((txt, i) => opts.appendChild(makeRow(h, i, txt, false)));
  opts.appendChild(makeRow(h, rowIndexOwn(h), h.own, true));
  if (keepFocus && activeIdx !== null) {
    const ta = opts.querySelector(`textarea[data-idx="${activeIdx}"]`);
    if (ta) { ta.focus({ preventScroll: true }); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
  opts.querySelectorAll("textarea").forEach(grow);
  syncHead();
}
function updateLoading() {
  const h = H.get(current), el = $("loading-text"); if (!h || !el) return;
  el.textContent = h.ahead > 0 ? `Guessing your comment… (${h.ahead} ahead in queue)` : "Guessing your comment…";
}
function makeRow(h, i, txt, isOwn) {
  const row = document.createElement("div");
  row.className = "opt" + (isOwn ? " own" : "") + (h.sel === i ? " sel" : "");
  const num = document.createElement("span"); num.className = "num"; num.textContent = isOwn ? "✎" : i + 1;
  const ta = document.createElement("textarea");
  ta.rows = 1; ta.value = txt; ta.dataset.idx = i;
  ta.placeholder = isOwn ? "None of these — write my own comment…" : "";
  ta.addEventListener("focus", () => choose(i));
  ta.addEventListener("input", () => {
    if (isOwn) h.own = ta.value; else h.rows[i] = ta.value;
    if (h.sel !== i) choose(i);
    grow(ta); syncHead();
  });
  row.addEventListener("mousedown", (e) => {
    choose(i);
    if (e.target !== ta) { e.preventDefault(); ta.focus(); }
  });
  row.append(num, ta);
  return row;
}
function grow(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }
function choose(i) {
  const h = H.get(current); if (!h) return;
  h.sel = i;
  opts.querySelectorAll(".opt").forEach((r) => {
    const ta = r.querySelector("textarea"); r.classList.toggle("sel", !!ta && +ta.dataset.idx === i);
  });
  syncHead();
}
function focusRow(i) { const ta = opts.querySelector(`textarea[data-idx="${i}"]`); if (ta) ta.focus({ preventScroll: true }); }
function chosenText(h) {
  if (h.sel < 0) return "";
  return (h.sel === rowIndexOwn(h) ? h.own : h.rows[h.sel] || "").trim();
}
function syncHead() {
  const h = H.get(current); if (!h) return;
  const t = chosenText(h), v = $("combo-val");
  v.textContent = t || "Choose or write a comment"; v.classList.toggle("placeholder", !t);
  $("pop-save").disabled = !t;
}
$("combo-head").addEventListener("click", () => $("combo").classList.toggle("closed"));

function closePop(discardIfDraft) {
  const h = H.get(current);
  if (h && discardIfDraft && h.status === "draft") removeHighlight(h.id);
  current = null; pop.classList.remove("open");
  paintMarks(); renderList();
}
function removeHighlight(id) {
  unwrap(id); H.delete(id);
  api("/cancel", { id });
}
$("pop-cancel").addEventListener("click", () => closePop(true));

async function save() {
  const h = H.get(current); if (!h) return;
  const comment = chosenText(h); if (!comment) return;
  const own = h.sel === rowIndexOwn(h);
  const edited = !own && h.guesses && comment !== (h.guesses[h.sel] || "").trim();
  h.comment = comment; h.status = "saved"; h.guessIndex = own ? -1 : h.sel;
  h.source = own ? "own" : edited ? "edited-guess" : "guess";
  await api("/comment", {
    id: h.id, text: h.text, paragraph: h.paragraph, section: h.section, block: h.block, start: h.start,
    comment, source: h.source, guess_index: h.guessIndex, guesses: h.guesses || [],
  });
  closePop(false);
}
$("pop-save").addEventListener("click", save);

document.addEventListener("keydown", (e) => {
  if (!pop.classList.contains("open")) return;
  if (e.key === "Escape") { e.preventDefault(); closePop(false); }
  else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); }
});
document.addEventListener("mousedown", (e) => {
  if (pop.classList.contains("open") && !pop.contains(e.target) && !e.target.closest("mark.hl, .item"))
    closePop(false);  // keep drafts; they stay in the sidebar
});
window.addEventListener("resize", () => current && position(current));

// ---------- sidebar ----------
function renderList() {
  const list = $("list"); list.innerHTML = "";
  const items = [...H.values()].sort((a, b) => a.block - b.block || a.start - b.start);
  $("count").textContent = items.length ? `(${items.filter((h) => h.status === "saved").length})` : "";
  if (!items.length) { list.innerHTML = '<div class="empty">No comments yet. Select text in the document to add one.</div>'; return; }
  for (const h of items) {
    const d = document.createElement("div");
    d.className = "item" + (h.status === "draft" ? " draft" : "") + (h.id === current ? " active" : "");
    const q = document.createElement("div"); q.className = "quote"; q.textContent = h.text;
    const t = document.createElement("div"); t.className = "text";
    t.textContent = h.status === "saved" ? h.comment : h.guesses ? "Guesses ready — click to choose" : "Awaiting comment…";
    const row = document.createElement("div"); row.className = "row";
    const tag = document.createElement("span"); tag.className = "tag";
    tag.textContent = h.status === "saved" ? { guess: "picked a guess", "edited-guess": "edited a guess", own: "own words" }[h.source] || "" : "draft";
    const del = document.createElement("button"); del.className = "link"; del.textContent = "Delete";
    del.addEventListener("click", (e) => {
      e.stopPropagation();
      if (current === h.id) closePop(false);
      if (h.status === "saved") api("/comment/delete", { id: h.id });
      removeHighlight(h.id); renderList();
    });
    row.append(tag, del); d.append(q, t, row);
    d.addEventListener("click", () => {
      const m = marksOf(h.id)[0]; if (m) m.scrollIntoView({ block: "center", behavior: "smooth" });
      setTimeout(() => openPop(h.id), m ? 250 : 0);
    });
    list.appendChild(d);
  }
}

// ---------- agent status / finish ----------
async function heartbeat() {
  try {
    const s = await fetch("/state").then((r) => r.json());
    const el = $("agent"), txt = $("agent-text"), ago = s.agent_seconds_ago;
    el.className = ago !== null && ago < 120 ? "on" : "warn";
    txt.textContent = ago === null ? "agent not connected yet" : ago < 15 ? "agent listening" :
      ago < 120 ? "agent writing guesses" : "agent idle — you can still write your own";
  } catch (_) { $("agent").className = "warn"; $("agent-text").textContent = "server unreachable"; }
}
$("finish").addEventListener("click", async () => {
  const drafts = [...H.values()].filter((h) => h.status === "draft").length;
  if (drafts && !confirm(`${drafts} highlight(s) have no comment yet and will be dropped. Finish anyway?`)) return;
  finished = true;
  for (const h of [...H.values()]) if (h.status === "draft") removeHighlight(h.id);
  await api("/done", {});
  closePop(false); $("overlay").classList.add("open");
});

// ---------- startup: render document, restore saved comments ----------
(async function init() {
  const doc = await fetch("/doc").then((r) => r.json());
  document.title = "Feedback · " + doc.name; $("title").textContent = doc.name;
  docEl.innerHTML = doc.html;
  const st = await fetch("/state").then((r) => r.json());
  for (const c of st.comments || []) {
    const h = { id: c.id, text: c.text, paragraph: c.paragraph, section: c.section, block: c.block ?? 1e9,
                start: c.start ?? 0, guesses: c.guesses || [], rows: (c.guesses || []).slice(), own: "",
                comment: c.comment, source: c.source, guessIndex: c.guess_index ?? -1, status: "saved" };
    if (h.guessIndex >= 0 && h.guessIndex < h.rows.length) { h.rows[h.guessIndex] = c.comment; h.sel = h.guessIndex; }
    else { h.own = c.comment; h.sel = h.rows.length; }
    H.set(h.id, h);
    // Re-anchor: try the stored offset, then search the block, then the whole document.
    let block = docEl.querySelector(`[data-block="${h.block}"]`), s = h.start;
    if (!block || block.textContent.slice(s, s + h.text.length) !== h.text) {
      s = block ? block.textContent.indexOf(h.text) : -1;
      if (s < 0) {
        block = [...docEl.querySelectorAll("[data-block]")].find((b) => b.textContent.includes(h.text));
        s = block ? block.textContent.indexOf(h.text) : -1;
      }
    }
    if (block && s >= 0) wrapRange(block, s, s + h.text.length, h.id);
  }
  if (st.done) { finished = true; $("overlay").classList.add("open"); }
  paintMarks(); renderList(); heartbeat(); setInterval(heartbeat, 5000);
})();
</script>
